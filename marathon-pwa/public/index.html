<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">
<title>Race Plan</title><style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1c2321;--mu:#5d6b66;--ac:#0f766e;--ac2:#ccfbf1;--bd:#e1e5e2;--wa:#b45309;--wb:#fef3c7;--q:#c2410c;--qb:#ffedd5;--l:#1d4ed8;--lb:#dbeafe;--s:#6d28d9;--sb:#ede9fe;--rd:#b91c1c;--rb:#fee2e2;--gr:#15803d;--gb:#dcfce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111514;--card:#1a201e;--tx:#e8eeeb;--mu:#9aa8a2;--ac:#2dd4bf;--ac2:#0f3d38;--bd:#2a3330;--wa:#fbbf24;--wb:#3a2e0d;--q:#fb923c;--qb:#3b2410;--l:#93c5fd;--lb:#1b2a4a;--s:#c4b5fd;--sb:#2a2147;--rd:#fca5a5;--rb:#3f1717;--gr:#86efac;--gb:#14351f}}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:88px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:0}
.mu{color:var(--mu);font-size:14px}.hide{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.day{display:grid;grid-template-columns:42px 1fr;gap:10px}.dn{font-weight:700;font-size:13px;color:var(--mu);padding-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin:0 4px 4px 0}
.t-E{background:var(--ac2);color:var(--ac)}.t-Q,.t-T{background:var(--qb);color:var(--q)}.t-L,.t-C{background:var(--lb);color:var(--l)}.t-S{background:var(--sb);color:var(--s)}.t-R{background:var(--bd);color:var(--mu)}
.g{background:var(--gb);color:var(--gr)}.w{background:var(--wb);color:var(--wa)}.r{background:var(--rb);color:var(--rd)}.b{background:var(--lb);color:var(--l)}
.bd{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
.today{outline:2px solid var(--ac)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk button{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.warn{background:var(--wb);color:var(--wa);border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:8px}.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.bars small{display:block;text-align:center;font-size:10px;color:var(--mu)}
.ex{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.ex:first-of-type{border-top:0}
.ex b{display:block}.ex span{font-size:14px;color:var(--mu)}.an{width:104px;height:70px;background:var(--bg);border-radius:10px}
.ins{padding:9px 0;border-top:1px solid var(--bd);font-size:15px}.ins:first-of-type{border-top:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-top:1px solid var(--bd);text-align:left;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;border-radius:10px}
nav button.on{color:var(--ac);font-weight:700;background:var(--ac2)}nav i{display:block;font-style:normal;font-size:19px}

select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.ex2{display:grid;grid-template-columns:minmax(0,130px) 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.ex2:first-child{border-top:0}
.ex2 svg{width:100%;height:auto;background:var(--bg);border-radius:10px;color:var(--ac)}.fx{font-size:14px;margin:6px 0 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0}
.ins{border-left:4px solid var(--bd);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0;font-size:15px}
.ins.ok{border-color:#16a34a}.ins.warn{border-color:#d97706}.ins.bad{border-color:#dc2626}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
nav button{font-size:11px}
</style></head><body>
<main><section id="v-plan"></section><section id="v-ins" class="hide"></section><section id="v-race" class="hide"></section><section id="v-str" class="hide"></section><section id="v-set" class="hide"></section></main>
<nav><button data-v="plan" class="on"><i>🏃</i>Program</button><button data-v="ins"><i>📊</i>Insight</button><button data-v="race"><i>🏁</i>Race</button><button data-v="str"><i>💪</i>Strength</button><button data-v="set"><i>⚙️</i>Profil</button></nav>
<script src="/data.js"></script><script src="/app.js"></script></body></html>
